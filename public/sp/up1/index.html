    .phone-container {

    .chat-agent-name { font-size: 14px; font-weight: 700; color: #121212; line-height: 1.2; }
    .chat-agent-status { font-size: 11px; color: #1DB954; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .chat-agent-status::before {
      content: ''; display: inline-block; width: 7px; height: 7px; background-color: #1DB954; border-radius: 50%;
      animation: statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
    .chat-messages {
      flex: 1; padding: 14px 12px 18px; display: flex; flex-direction: column; gap: 11px; overflow-y: auto;
      -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
    }
    .message-row {
      display: flex; align-items: flex-end; gap: 8px; max-width: 100%;
      animation: messageIn .34s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(9px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .message-avatar {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: 0 0 30px;
      border: 1.5px solid rgba(29,185,84,.7); box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .inline-message-icon {
      width: 18px; height: 18px; display: inline-block; vertical-align: -4px; margin-right: 6px; color: #169c46;
    }
    .message-bubble {
      max-width: 78%; padding: 11px 14px; border-radius: 18px 18px 18px 5px; font-size: 14.5px; line-height: 1.45;
      color: #121212; background: #fff; border: 1px solid rgba(18,18,18,.06);
      box-shadow: 0 3px 12px rgba(18,18,18,.10), 0 1px 2px rgba(18,18,18,.06); word-break: break-word;
      opacity: 0; transform: translateY(8px); transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .message-bubble.visible { opacity: 1; transform: translateY(0); }
    .typing-bubble {
      display: flex; align-items: center; gap: 4px; padding: 13px 14px; background: #fff;
      border: 1px solid rgba(18,18,18,.06); border-radius: 18px 18px 18px 5px; width: fit-content;
      box-shadow: 0 3px 12px rgba(18,18,18,.10), 0 1px 2px rgba(18,18,18,.06);
      opacity: 0; transition: opacity 0.25s ease;
    }
    .typing-bubble.visible { opacity: 1; }
    .typing-bubble span {
      width: 7px; height: 7px; background: #aaa; border-radius: 50%; display: inline-block; animation: typingDot 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot { 0%, 60%, 100% { transform: translateY(0); background: #aaa; } 30% { transform: translateY(-5px); background: #1DB954; } }
    .checkout-card {
      flex: 1; min-width: 0; max-width: calc(100% - 38px); opacity: 0; transform: translateY(10px);

    }
    .checkout-card.visible { opacity: 1; transform: translateY(0); }
    .checkout-btn {

    @keyframes spinOverlay { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      body { height: 100dvh; align-items: stretch; }

      .app-header { height: 54px; padding: 0 12px; }
      .chat-wrapper { padding: 14px 8px 8px; }
      .message-bubble { max-width: calc(100% - 38px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .message-row, .message-bubble, .checkout-card { animation: none; transition: none; }
    }

          btn.style.opacity = '0.7';

          var overlay = document.getElementById('loadingOverlay');
          if (overlay) overlay.style.display = 'flex';

          try {
            var res = await fetch('https://checkout.melodyrewards.com/api/stripe-charge-upsell', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                customer_id: cid,
                payment_method_id: pm,
                upsell_number: 1,
                email: email,
                name: name,
                extra_params: Object.fromEntries(new URLSearchParams(window.location.search).entries())
              })
            });
            var data = await res.json();
            if (data && data.next_url) {
              window.location.href = data.next_url;
              return;
            }
          } catch (e) {
            console.error('Upsell charge error:', e);
          }

          var up2Url = 'https://up2.melodyrewards.com' + (window.location.search || '');
          window.location.href = up2Url;
        });

        if (skipBtn) {
          skipBtn.addEventListener('click', function (e) {
            e.preventDefault();
            var up2Url = 'https://up2.melodyrewards.com' + (window.location.search || '');
            window.location.href = up2Url;
          });
        }
      }

      var idx = 0;
      function next() {
        if (idx >= messages.length) return;
        var m = messages[idx++];
        if (m.type === 'text') {
          showTyping(function () {
            addMessage(m.html);
            next();
          }, m.delay || 2000);
        } else if (m.type === 'btn') {
          showTyping(function () {
            addCheckout();
          }, m.delay || 1000);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', next);
      } else {
        next();
      }
    })();
  </script>
</body>
</html>
